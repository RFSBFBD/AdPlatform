<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Slate Outer Badge with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Dynamic Vector Graph & Connected Nodes -->
  <path d="M14 44 L26 30 L38 38 L50 18" stroke="url(#brand-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Subtle Trend Fill -->
  <path d="M14 44 L26 30 L38 38 L50 18 V46 H14 Z" fill="url(#brand-grad)" opacity="0.15" />

  <!-- Glowing Strategic Nodes -->
  <circle cx="14" cy="44" r="4.5" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="26" cy="30" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="38" cy="38" r="4" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="50" cy="18" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2.2" />
  <circle cx="50" cy="18" r="2" fill="#FFFFFF" />
</svg>
