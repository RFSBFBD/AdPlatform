services:
  # 1. Nginx Reverse Proxy (SSL & HTTP/2)
  nginx:
    image: nginx:alpine
    container_name: ad_platform_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ad_platform_prod_net

  # 2. Laravel 11 Backend (PHP 8.3 FPM)
  backend:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ad_platform_prod_backend
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ad_platform}
      DB_USERNAME: ${DB_USERNAME:-ad_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ad_platform_prod_net

  # 3. PostgreSQL 16 Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: ad_platform_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ad_platform}
      POSTGRES_USER: ${DB_USERNAME:-ad_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ad_user} -d ${DB_DATABASE:-ad_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ad_platform_prod_net

  # 4. Redis 7 (Cache, Sessions, Distributed Locks)
  redis:
    image: redis:7-alpine
    container_name: ad_platform_prod_redis
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ad_platform_prod_net

  # 5. Laravel Queue Worker
  queue-worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ad_platform_prod_queue
    restart: always
    command: php artisan queue:work --queue=default,high --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - backend
      - redis
    networks:
      - ad_platform_prod_net

  # 6. Laravel Cron Scheduler
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ad_platform_prod_scheduler
    restart: always
    command: sh -c "while true; do php /var/www/backend/artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - backend
    networks:
      - ad_platform_prod_net

networks:
  ad_platform_prod_net:
    driver: bridge

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local
